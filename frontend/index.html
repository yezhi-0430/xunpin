<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18322f" />
    <title>巡品 · 商品与竞品监控</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/simulation.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="巡品首页"
        ><span class="brand-mark">巡</span
        ><span>巡品<small>XUNPIN / MONITOR</small></span></a
      >
      <div class="nav-label">运营工作台</div>
      <nav aria-label="主导航">
        <button class="nav-item active" data-page="overview">
          <span>◫</span>监控概览
        </button>
        <button class="nav-item" data-page="events">
          <span>↗</span>变化事件<b id="nav-event-count">0</b>
        </button>
        <button class="nav-item" data-page="tasks">
          <span>☷</span>运营任务<b id="nav-task-count">0</b>
        </button>
        <button class="nav-item" data-page="sources">
          <span>⊞</span>数据与风控
        </button>
        <button class="nav-item" data-page="history"><span>▤</span>真实历史样本</button>
        <a class="nav-item briefing-nav" href="/static/briefing.html"><span>◎</span>方案与验收</a>
      </nav>
      <div class="sidebar-note">
        <span class="pulse"></span>以证据驱动运营
        <p>每一次变化，都有来源。<br />每一条建议，都可追溯。</p>
      </div>
      <div class="sidebar-bottom">
        面试方案 · 本地工作台<small>v0.1 / 单进程运行</small>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="breadcrumb">
          工作台 <span>/</span> <span id="page-crumb">监控概览</span>
        </div>
        <div class="topbar-right">
          <span class="small-dot"></span><span id="clock"></span
          ><button class="text-button" id="refresh-btn">刷新数据 ↻</button>
        </div>
      </header>
      <div class="workspace">
        <section class="page-heading">
          <div>
            <div class="eyebrow">TAOBAO PRODUCT INTELLIGENCE</div>
            <h1 id="page-title">商品监控工作台</h1>
            <p id="page-description">
              跟踪关键变化，让下一步运营动作有据可依。
            </p>
          </div>
          <div class="mode-control" aria-label="数据模式">
            <button data-mode="live" class="selected">当前数据</button
            ><button data-mode="replay">流程回放</button>
          </div>
        </section>
        <div id="mode-notice" class="notice"></div>
        <div id="content" aria-live="polite">
          <div class="empty">正在读取工作台…</div>
        </div>
        <footer>
          <span>巡品 · 淘宝商品与竞品监控 Agent</span
          ><span>事实有来源 · 推测有边界 · 动作有反馈</span>
        </footer>
      </div>
    </main>
    <dialog id="detail-dialog">
      <div class="dialog-top">
        <span id="dialog-kicker">事件证据</span
        ><button id="close-dialog" aria-label="关闭详情">×</button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
