[project]
name = "taobao-agent-monitor"
version = "0.1.0"
description = "Evidence-based product monitoring workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "python-dotenv>=1,<2"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
