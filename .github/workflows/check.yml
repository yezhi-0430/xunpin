name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt pytest httpx2
      - run: python -m pytest -q
      - run: python -m evaluations.run --check
      - run: node --check frontend/app.js
      - run: node --check frontend/simulation.js
